name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Codejohnn
          outputs: |
            dist/github-snake.svg?palette=github-dark&color_snake=#8B00FF&color_dots=#161B22,#0E4429,#006D32,#26A641,#39D353
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#8B00FF&color_dots=#161B22,#0E4429,#006D32,#26A641,#39D353

      - name: Push Snake
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
